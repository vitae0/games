name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check simulations/damped-oscillator/sim.js
          node --check simulations/radioactive-decay/sim.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for path in [
              "games/afterimage/index.html",
              "games/tidal-cartographer/index.html",
          ]:
              text = Path(path).read_text(encoding="utf-8")
              match = re.search(r"<script>(.*?)</script>", text, re.S)
              if not match:
                  raise SystemExit(f"No inline script found in {path}")
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
                  f.write(match.group(1))
                  temp = f.name
              subprocess.run(["node", "--check", temp], check=True)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
