name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check games/afterimage/game.js
          node --check games/tidal-cartographer/game.js
          node --check simulations/damped-oscillator/sim.js
          node --check simulations/radioactive-decay/sim.js
          node --check katex-loader.js
      - name: Check required pages
        run: |
          test -f index.html
          test -f home.css
          test -f play.css
          test -f lab.css
          test -f games/afterimage/index.html
          test -f games/tidal-cartographer/index.html
          test -f simulations/damped-oscillator/index.html
          test -f simulations/radioactive-decay/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
