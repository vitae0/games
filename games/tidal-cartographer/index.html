<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidal Cartographer</title><link rel="stylesheet" href="../../play.css?v=2"></head><body><div class="game-shell">
<header class="game-bar"><a class="game-back" href="../../" aria-label="Ana menü">←</a><div><div class="game-title">Tidal Cartographer</div><div class="game-subtitle">Akıntıyı okuyup üç şamandırayı sırayla tara, sonra üsse dön.</div></div><div class="game-stats"><span class="pill">Süre <strong id="time">90.0</strong>s</span><span class="pill">Yakıt <strong id="fuel">100</strong>%</span><span class="pill">İstasyon <strong id="station">0/3</strong></span><span class="pill">Hız <strong id="speed">0</strong></span></div></header>

<div class="touch-pad"><button class="up" data-key="up">↑</button><button class="left" data-key="left">←</button><button class="wait" data-key="down">fren</button><button class="right" data-key="right">→</button><button class="down" data-key="down">↓</button></div>
</div></main></div><script src="./game.js?v=2"></script></body></html>
